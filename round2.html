<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round 2: Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Bubblegum Sans', cursive;
    background: linear-gradient(135deg, #4ECDC4, #44A08D);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 20px 20px 0;
    overflow: auto;
}

/* ===== TIMER (TOP TO BOTTOM) ===== */
.timer-container {
    position: fixed;
    right: 0;
    top: 0;
    width: 18px;
    height: 100vh;
    background: rgba(0,0,0,0.15);
    z-index: 100;
}

.timer-bar {
    width: 100%;
    height: 0%;
    background: #00FF00;
    position: absolute;
    top: 0;
    left: 0;
    animation: countdown 600s linear forwards;
}

@keyframes countdown {
    from { height: 0%; }
    to { height: 100%; }
}

/* ===== MAIN CARD ===== */
.card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 1000px;
    width: calc(100% - 40px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
    margin: 20px auto;
    max-height: 90vh;
    overflow-y: auto;
}

.card::-webkit-scrollbar {
    width: 10px;
}

.card::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.card::-webkit-scrollbar-thumb {
    background: #44A08D;
    border-radius: 10px;
}

.round-title {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    color: #44A08D;
    margin-bottom: 10px;
}

.question-number {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #FF6B6B;
    margin-bottom: 25px;
}

.question-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 15px;
    padding: 30px;
    color: white;
    margin-bottom: 30px;
}

.original {
    font-size: 26px;
    margin-bottom: 20px;
    word-wrap: break-word;
}

.instruction {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #FFD700;
    word-wrap: break-word;
}

/* ===== CONTROLS ===== */
.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    bottom: 0;
    background: white;
    padding: 20px 0 0 0;
    border-top: 2px solid #f0f0f0;
}

.btn {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    padding: 18px 45px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    min-width: 180px;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-next {
    background: linear-gradient(145deg, #FFD700, #FFA500);
}

.btn-end {
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
}

/* ===== REVIEW ===== */
.review {
    display: none;
    background: white;
    padding: 40px;
    max-width: 1200px;
    width: calc(100% - 40px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-height: 90vh;
    overflow-y: auto;
    margin: 20px auto;
}

.review h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 40px;
    color: #FF6B6B;
    text-align: center;
    margin-bottom: 30px;
}

.review-item {
    margin-bottom: 35px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
}

.review-item p {
    font-size: 26px;
    margin-bottom: 6px;
    word-wrap: break-word;
}

.answer {
    font-weight: bold;
    color: #44A08D;
}

/* ===== MODAL POPUP ===== */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    animation: modalPop 0.5s ease-out;
}

@keyframes modalPop {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.modal-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
}

.modal-content h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #FF6B6B;
    margin-bottom: 20px;
}

.modal-content p {
    font-size: 24px;
    margin-bottom: 30px;
    color: #333;
}

.modal-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    padding: 15px 50px;
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.modal-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

@media (max-width: 768px) {
    .controls {
        flex-direction: column;
        position: static;
    }
    
    .btn {
        width: 100%;
        min-width: auto;
        font-size: 20px;
        padding: 15px 30px;
    }
    
    .modal-content {
        padding: 30px;
    }
    
    .modal-content h2 {
        font-size: 36px;
    }
    
    .modal-icon {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<!-- TIMER -->
<div class="timer-container">
    <div class="timer-bar"></div>
</div>

<!-- GAME VIEW -->
<div class="card" id="gameView">
    <div class="round-title">Round 2: Challenge</div>
    <div class="question-number" id="questionNumber"></div>

    <div class="question-box">
        <div class="original" id="originalSentence"></div>
        <div class="instruction" id="instruction"></div>
    </div>

    <div class="controls">
        <button class="btn btn-next" id="nextBtn">Next</button>
        <button class="btn btn-end" id="endBtn">End</button>
    </div>
</div>

<!-- REVIEW VIEW -->
<div class="review" id="reviewView">
    <h2>Answer Review</h2>
    <div id="reviewList"></div>
</div>

<!-- TIME'S UP MODAL -->
<div class="modal-overlay" id="timesUpModal">
    <div class="modal-content">
        <div class="modal-icon">⏰</div>
        <h2>TIME'S UP!</h2>
        <p>The round has ended</p>
        <button class="modal-btn" id="modalOkBtn">OK</button>
    </div>
</div>

<script>
let questions = [];
let index = 0;
let timerTimeout;
let timerAnimationEnd;

/* LOAD QUESTIONS */
$(document).ready(function() {
    const selectedCsvFile = localStorage.getItem('sentenceMasterCSV') || 'questions_easy.csv';
    
    fetch(selectedCsvFile)
        .then(r => r.text())
        .then(csv => {
            const lines = csv.split('\n');
            for (let i = 1; i < lines.length; i++) {
                const p = lines[i].split(',');
                if (p.length >= 4) {
                    questions.push({
                        q: p[1].trim(),
                        c: p[2].trim(),
                        a: p[3].trim()
                    });
                }
            }
            questions.sort(() => Math.random() - 0.5);
            showQuestion();
            
            // Set timer for 10 minutes (600000 ms)
            timerTimeout = setTimeout(function() {
                showTimesUpModal();
            }, 600000);
            
            // Listen for animation end on timer bar
            $('.timer-bar').on('animationend', function() {
                showTimesUpModal();
            });
        });
});

function showQuestion() {
    if (index >= questions.length) index = 0;
    const q = questions[index];
    $('#questionNumber').text(`Question ${index + 1}`);
    $('#originalSentence').text(q.q);
    $('#instruction').text(`→ Change to: ${q.c}`);
}

function showTimesUpModal() {
    // Clear the timeout to prevent multiple triggers
    clearTimeout(timerTimeout);
    
    // Show the modal
    $('#timesUpModal').fadeIn(300).css('display', 'flex');
    
    // Pause the timer animation
    $('.timer-bar').css('animation-play-state', 'paused');
}

$('#nextBtn').click(() => {
    index++;
    showQuestion();
});

$('#endBtn').click(showAnswers);

function showAnswers() {
    clearTimeout(timerTimeout);
    $('#gameView').hide();
    $('#reviewView').show();
    $('#reviewList').empty();

    questions.forEach((q, i) => {
        $('#reviewList').append(`
            <div class="review-item">
                <p><strong>Question ${i + 1}</strong></p>
                <p>${q.q}</p>
                <p>→ ${q.c}</p>
                <p class="answer">✔ ${q.a}</p>
            </div>
        `);
    });
}

// Modal OK button click
$('#modalOkBtn').on('click', function() {
    // If we're in game view, show answers; if in review view, go to winner
    if ($('#gameView').is(':visible')) {
        showAnswers();
    } else {
        location.href = 'winner.html';
    }
});

// Clear timeout when leaving page
window.addEventListener('beforeunload', function() {
    clearTimeout(timerTimeout);
});
</script>

</body>
</html>
