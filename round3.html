<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 3: Elimination Battle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Bubblegum Sans', cursive;
            background: linear-gradient(135deg, #FF6B6B, #EE5A6F);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .question-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .stage-title {
            font-family: 'Fredoka One', cursive;
            font-size: 42px;
            color: #FF6B6B;
            margin-bottom: 10px;
        }

        .stage-subtitle {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .question-number {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .question-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            padding: 30px;
            color: white;
            margin-bottom: 25px;
        }

        .original-sentence {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .change-instruction {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #FFD700;
        }

        .answer-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            display: none;
        }

        .answer-label {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #FF6B6B;
            margin-bottom: 10px;
        }

        .answer-text {
            font-size: 22px;
            color: #2c3e50;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 3px solid #FF6B6B;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            padding: 14px 32px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .control-btn:hover { transform: translateY(-3px); }

        .btn-show { background: linear-gradient(145deg, #4ECDC4, #44A08D); }
        .btn-next { background: linear-gradient(145deg, #FFD700, #FFA500); }
        .btn-end  { background: linear-gradient(145deg, #FF6B6B, #EE5A6F); }
        .btn-home { background: linear-gradient(145deg, #95a5a6, #7f8c8d); }

        .hidden { display: none !important; }

        /* TIMER — FLUSH RIGHT EDGE */
        .timer-wrapper {
            position: fixed;
            top: 0;
            right: 0;
            width: 20px;
            height: 100vh;
            background: rgba(0,0,0,0.15);
        }

        .timer-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #00FF00;
            transition: height 1s linear;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .control-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="question-container">
    <div class="stage-title">⚔️ Stage 3: Elimination Battle</div>
    <div class="stage-subtitle">Last One Standing Wins</div>

    <div class="question-number" id="questionNumber"></div>

    <div class="question-box">
        <div class="original-sentence" id="originalSentence"></div>
        <div class="change-instruction" id="changeInstruction"></div>
    </div>

    <div class="answer-section" id="answerSection">
        <div class="answer-label">✓ Correct Answer</div>
        <div class="answer-text" id="answerText"></div>
    </div>

    <div class="controls">
        <button type="button" class="control-btn btn-show" id="showAnswerBtn">Show Answer</button>
        <button type="button" class="control-btn btn-next hidden" id="nextBtn">Next</button>
        <button type="button" class="control-btn btn-end hidden" id="endBtn">End Game</button>
        <button type="button" class="control-btn btn-home" onclick="location.href='index.html'">Home</button>
    </div>
</div>

<div class="timer-wrapper">
    <div class="timer-bar" id="timerBar"></div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    const ROUND_TIME = 15;
    let timeLeft = ROUND_TIME;
    let timer = null;

    $(document).ready(function () {
        fetch('./questions.csv')
            .then(res => res.text())
            .then(csv => {
                parseCSV(csv);
                showQuestion();
            });
    });

    function parseCSV(csv) {
        const lines = csv.split('\n');
        for (let i = 1; i < lines.length; i++) {
            const p = lines[i].split(',');
            if (p.length >= 4) {
                questions.push({
                    original: p[1].trim(),
                    changeTo: p[2].trim(),
                    answer: p[3].trim()
                });
            }
        }
        questions.sort(() => Math.random() - 0.5);
    }

    function showQuestion() {
        if (currentIndex >= questions.length) {
            showWinner();
            return;
        }

        const q = questions[currentIndex];

        $('#questionNumber').text(`Question ${currentIndex + 1}`);
        $('#originalSentence').text(q.original);
        $('#changeInstruction').text(`Change to: ${q.changeTo}`);
        $('#answerText').text(q.answer);

        $('#answerSection').hide();
        $('#showAnswerBtn').removeClass('hidden');
        $('#nextBtn, #endBtn').addClass('hidden');

        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = ROUND_TIME;
        updateTimerBar();

        timer = setInterval(() => {
            timeLeft--;
            updateTimerBar();
            if (timeLeft <= 0) {
                clearInterval(timer);
            }
        }, 1000);
    }

    function updateTimerBar() {
        $('#timerBar').css('height', (timeLeft / ROUND_TIME * 100) + '%');
    }

    $('#showAnswerBtn').on('click', function () {
        clearInterval(timer);
        $('#answerSection').slideDown(300);
        $(this).addClass('hidden');
        $('#nextBtn, #endBtn').removeClass('hidden');
    });

    $('#nextBtn').on('click', function () {
        currentIndex++;
        showQuestion();
    });

    $('#endBtn').on('click', function () {
        clearInterval(timer);
        if (confirm('Crown the winner?')) {
            showWinner();
        }
    });

    function showWinner() {
        location.href = 'winner.html';
    }
</script>

</body>
</html>
