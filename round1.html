<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round 1 – Team Battle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Bubblegum Sans', cursive;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 20px 0;
    overflow: auto;
}

/* ================= TIMER BAR ================= */
.timer-container {
    position: fixed;
    right: 0;
    top: 0;
    height: 100vh;
    width: 18px;
    background: rgba(0,0,0,0.15);
    z-index: 100;
}

.timer-bar {
    width: 100%;
    height: 0%;
    background: #00FF00;
    position: absolute;
    top: 0;
    left: 0;
    animation: countdown 600s linear forwards;
}

@keyframes countdown {
    from { height: 0%; }
    to { height: 100%; }
}

/* ================= MAIN CARD ================= */
.question-container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    max-width: 1000px;
    width: 95%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
    margin: 20px auto;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

/* Custom scrollbar */
.question-container::-webkit-scrollbar {
    width: 10px;
}

.question-container::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.question-container::-webkit-scrollbar-thumb {
    background: #FF6B6B;
    border-radius: 10px;
}

.stage-title {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    color: #FF6B6B;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.stage-subtitle {
    font-size: 20px;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.question-number {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #4ECDC4;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.question-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 15px;
    padding: 25px;
    color: white;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.original-sentence {
    font-size: 26px;
    margin-bottom: 15px;
    line-height: 1.4;
    word-wrap: break-word;
}

.change-instruction {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: #FFD700;
    word-wrap: break-word;
}

/* ================= ANSWER ================= */
.answer-section {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    flex-shrink: 0;
}

.answer-section::-webkit-scrollbar {
    width: 8px;
}

.answer-section::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.answer-section::-webkit-scrollbar-thumb {
    background: #4ECDC4;
    border-radius: 10px;
}

.answer-label {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #4ECDC4;
    margin-bottom: 10px;
}

.answer-text {
    font-size: 22px;
    color: #2c3e50;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 3px solid #4ECDC4;
    word-wrap: break-word;
}

/* ================= CONTROLS ================= */
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 15px 0 5px 0;
    background: white;
    border-top: 2px solid #f0f0f0;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 10;
}

.control-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    padding: 15px 35px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    min-width: 160px;
}

.control-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-show { background: linear-gradient(145deg, #4ECDC4, #44A08D); }
.btn-next { background: linear-gradient(145deg, #FFD700, #FFA500); }
.btn-home { background: linear-gradient(145deg, #95a5a6, #7f8c8d); }

.hidden { display: none !important; }

/* ================= MODAL POPUP ================= */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    animation: modalPop 0.5s ease-out;
}

@keyframes modalPop {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.modal-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
}

.modal-content h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #FF6B6B;
    margin-bottom: 20px;
}

.modal-content p {
    font-size: 24px;
    margin-bottom: 30px;
    color: #333;
}

.modal-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    padding: 15px 50px;
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.modal-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* Tablet specific styles */
@media (max-width: 1024px) and (min-width: 768px) {
    .question-container {
        padding: 25px;
        max-height: 85vh;
    }
    
    .stage-title {
        font-size: 38px;
    }
    
    .original-sentence {
        font-size: 24px;
    }
    
    .control-btn {
        font-size: 18px;
        padding: 12px 25px;
        min-width: 140px;
    }
    
    .modal-content {
        padding: 30px;
    }
    
    .modal-content h2 {
        font-size: 42px;
    }
}

@media (max-width: 767px) {
    body {
        padding: 10px 10px 10px 0;
        align-items: flex-start;
    }
    
    .question-container {
        padding: 20px;
        max-height: none;
    }
    
    .stage-title {
        font-size: 32px;
    }
    
    .original-sentence { 
        font-size: 22px; 
    }
    
    .controls { 
        flex-direction: column; 
        align-items: center;
        position: static;
    }
    
    .control-btn { 
        width: 100%;
        min-width: auto;
    }
    
    .modal-content {
        padding: 25px;
    }
    
    .modal-content h2 {
        font-size: 36px;
    }
    
    .modal-icon {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<!-- TIMER -->
<div class="timer-container">
    <div class="timer-bar"></div>
</div>

<!-- MAIN CONTENT -->
<div class="question-container">
    <h1 class="stage-title">🏆 Round 1: Team Battle</h1>
    <p class="stage-subtitle">Most correct answers wins!</p>

    <div class="question-number" id="questionNumber"></div>

    <div class="question-box">
        <div class="original-sentence" id="originalSentence"></div>
        <div class="change-instruction" id="changeInstruction"></div>
    </div>

    <div class="answer-section" id="answerSection">
        <div class="answer-label">✓ Correct Answer</div>
        <div class="answer-text" id="answerText"></div>
    </div>

    <div class="controls">
        <button class="control-btn btn-show" id="showAnswerBtn">Show Answer</button>
        <button class="control-btn btn-next hidden" id="nextBtn">Next</button>
        <button class="control-btn btn-home" onclick="location.href='index.html'">Home</button>
    </div>
</div>

<!-- TIME'S UP MODAL -->
<div class="modal-overlay" id="timesUpModal">
    <div class="modal-content">
        <div class="modal-icon">⏰</div>
        <h2>TIME'S UP!</h2>
        <p>The round has ended</p>
        <button class="modal-btn" id="modalOkBtn">OK</button>
    </div>
</div>

<script>
let questions = [];
let currentIndex = 0;
let timerTimeout;

$(document).ready(function () {
    // Get the selected CSV file from localStorage
    const selectedCsvFile = localStorage.getItem('sentenceMasterCSV');
    
    if (!selectedCsvFile) {
        alert('No CSV file selected. Please go back and choose a level.');
        window.location.href = 'index.html';
        return;
    }
    
    console.log('Loading CSV file:', selectedCsvFile);
    
    fetch(selectedCsvFile)
        .then(res => {
            if (!res.ok) {
                throw new Error(`Could not load ${selectedCsvFile}`);
            }
            return res.text();
        })
        .then(csv => {
            console.log('CSV loaded, length:', csv.length);
            parseCSV(csv);
            
            if (questions.length === 0) {
                alert('No valid questions found in the CSV file. Please check the file format.');
                return;
            }
            
            console.log('Questions loaded:', questions.length);
            showQuestion();
            
            // Set timer for 10 minutes (600000 ms)
            timerTimeout = setTimeout(function() {
                showTimesUpModal();
            }, 600000);
            
            // Listen for animation end on timer bar
            $('.timer-bar').on('animationend', function() {
                showTimesUpModal();
            });
        })
        .catch(error => {
            alert('Error loading CSV: ' + error.message);
            console.error('Fetch error:', error);
        });
});

function parseCSV(csv) {
    const lines = csv.split('\n');
    questions = [];

    // Check if the file uses tabs or commas
    const firstLine = lines[1] || '';
    const delimiter = firstLine.includes('\t') ? '\t' : ',';
    
    console.log('Using delimiter:', delimiter);

    for (let i = 1; i < lines.length; i++) {
        if (lines[i].trim() === '') continue; // Skip empty lines
        
        let parts;
        if (delimiter === '\t') {
            parts = lines[i].split('\t');
        } else {
            parts = lines[i].split(',');
        }
        
        if (parts.length >= 4) {
            questions.push({
                original: parts[1]?.trim() || '',
                changeTo: parts[2]?.trim() || '',
                answer: parts[3]?.trim() || ''
            });
        }
    }

    // Filter out any empty questions
    questions = questions.filter(q => q.original && q.changeTo && q.answer);
    
    // RANDOMIZE QUESTIONS
    questions.sort(() => Math.random() - 0.5);
}

function showQuestion() {
    if (currentIndex >= questions.length) {
        clearTimeout(timerTimeout);
        location.href = 'winner.html';
        return;
    }

    const q = questions[currentIndex];

    $('#questionNumber').text(`Question ${currentIndex + 1} of ${questions.length}`);
    $('#originalSentence').text(q.original);
    $('#changeInstruction').text(`→ Change to: ${q.changeTo}`);
    $('#answerText').text(q.answer);

    $('#answerSection').hide();
    $('#showAnswerBtn').removeClass('hidden');
    $('#nextBtn').addClass('hidden');
    
    // Scroll to top of question container
    $('.question-container').scrollTop(0);
}

function showTimesUpModal() {
    // Clear the timeout to prevent multiple triggers
    clearTimeout(timerTimeout);
    
    // Show the modal
    $('#timesUpModal').fadeIn(300).css('display', 'flex');
    
    // Pause the timer animation
    $('.timer-bar').css('animation-play-state', 'paused');
}

$('#showAnswerBtn').on('click', function () {
    $('#answerSection').slideDown(300, function() {
        // After answer is shown, scroll to make sure buttons are visible
        $('.question-container').animate({
            scrollTop: $('.question-container')[0].scrollHeight
        }, 500);
    });
    $(this).addClass('hidden');
    $('#nextBtn').removeClass('hidden');
});

$('#nextBtn').on('click', function () {
    currentIndex++;
    showQuestion();
});

// Modal OK button click
$('#modalOkBtn').on('click', function() {
    // Redirect to winner page
    location.href = 'winner.html';
});

// Clear timeout when leaving page
window.addEventListener('beforeunload', function() {
    clearTimeout(timerTimeout);
});
</script>

</body>
</html>
