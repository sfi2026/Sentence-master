<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Master Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bubblegum Sans', cursive;
            //background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: slideIn 0.8s ease-out;
            padding-bottom: 100px; /* ✅ space under buttons */
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .logo {
            max-width: 350px;
            width: 90%;
            /* filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3)); */
            margin-top: 0;
        }

        /* ===== FILE UPLOAD SECTION ===== */
        .upload-section {
            margin: 10px auto 30px auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .file-label {
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .file-label i {
            margin-right: 8px;
            font-size: 18px;
        }

        #fileInput {
            display: none;
        }

        #fileName {
            font-family: 'Bubblegum Sans', cursive;
            font-size: 16px;
            margin-left: 15px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
        }

        .button-grid {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            justify-content: center;
            flex-wrap: nowrap;
            margin-top: 10px;
        }

        .game-button {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            padding: 18px 28px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .game-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .game-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .game-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .btn-stage1 {
            background: linear-gradient(145deg, #FFD700, #FFA500);
        }

        .btn-stage2 {
            background: linear-gradient(145deg, #4ECDC4, #44A08D);
        }

        .btn-stage3 {
            background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
        }

        .btn-exit {
            background: linear-gradient(145deg, #95a5a6, #7f8c8d);
            font-size: 24px;
            padding: 20px;
        }

        .sparkle {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s linear infinite;
            opacity: 0;
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .sparkle span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .sparkle span:nth-child(2) { left: 25%; animation-delay: 0.5s; }
        .sparkle span:nth-child(3) { left: 40%; animation-delay: 1s; }
        .sparkle span:nth-child(4) { left: 55%; animation-delay: 1.5s; }
        .sparkle span:nth-child(5) { left: 70%; animation-delay: 0.3s; }
        .sparkle span:nth-child(6) { left: 85%; animation-delay: 0.8s; }
        .sparkle span:nth-child(7) { left: 90%; animation-delay: 1.3s; }

        @media (max-width: 768px) {
            .button-grid {
                flex-direction: column;
                gap: 20px;
            }

            .game-button {
                font-size: 24px;
                padding: 25px 30px;
            }
            
            .upload-section {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                background: none;
                backdrop-filter: none;
            }
            
            #fileName {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="sparkle">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="Sentence Master Logo.png" alt="Sentence Master Challenge" class="logo">
        </div>

        <!-- FILE UPLOAD SECTION -->
        <div class="upload-section">
            <label for="fileInput" class="file-label">
                <span>📁</span> Choose CSV File
            </label>
            <input type="file" id="fileInput" accept=".csv">
            <span id="fileName">No file chosen</span>
        </div>

        <div class="button-grid">
            <a href="round1.html" class="game-button btn-stage1" id="round1Link">
                Round 1: Team, 10mins
            </a>
            <a href="round2.html" class="game-button btn-stage2" id="round2Link">
                Round 2: Writing Challenge, 10mins
            </a>
            <a href="round3.html" class="game-button btn-stage3" id="round3Link">
                Round 3: 1 vs. 1, Ultimate Battle
            </a>
            <!--<button class="game-button btn-exit" onclick="if(confirm('Are you sure?')) window.close();">
                Exit
            </button>-->
        </div>
    </div>

    <script>
        // File upload handling with localStorage
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        
        // Check if a file was previously selected
        const savedFileName = localStorage.getItem('sentenceMasterFileName');
        if (savedFileName) {
            fileName.textContent = savedFileName;
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Update file name display
                fileName.textContent = file.name;
                localStorage.setItem('sentenceMasterFileName', file.name);
                
                // Read the file
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Store the CSV content in localStorage
                    localStorage.setItem('sentenceMasterCSV', event.target.result);
                    
                    // Show success message (optional)
                    fileName.style.background = '#e8f5e8';
                    setTimeout(() => {
                        fileName.style.background = 'rgba(255, 255, 255, 0.8)';
                    }, 500);
                };
                reader.readAsText(file);
            }
        });

        // Handle round links - ensure CSV is loaded before proceeding
        document.getElementById('round1Link').addEventListener('click', function(e) {
            if (!localStorage.getItem('sentenceMasterCSV')) {
                e.preventDefault();
                alert('⚠️ Please select a CSV file first!');
            }
        });

        document.getElementById('round2Link').addEventListener('click', function(e) {
            if (!localStorage.getItem('sentenceMasterCSV')) {
                e.preventDefault();
                alert('⚠️ Please select a CSV file first!');
            }
        });

        document.getElementById('round3Link').addEventListener('click', function(e) {
            if (!localStorage.getItem('sentenceMasterCSV')) {
                e.preventDefault();
                alert('⚠️ Please select a CSV file first!');
            }
        });
    </script>
</body>
</html>
